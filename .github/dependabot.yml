version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # bitflag-php is upgraded on purpose, together with protocol.lock.json and its changelog link.
    ignore:
      - dependency-name: bitflag/bitflag-php
    groups:
      composer:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
