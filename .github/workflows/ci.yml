name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Composer installs the private bitflag-php repository with this token (read access to usebitflag/bitflag-php).
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.PROTOCOL_READ_TOKEN }}"}}'
  PHP_VERSION: '8.5'
  PHP_EXTENSIONS: bcmath, intl, mbstring, pcntl, pdo_mysql, posix, redis, zip

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php scripts/ci/no-path-repositories.php

  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Fetch the pinned protocol release
        env:
          GH_TOKEN: ${{ secrets.PROTOCOL_READ_TOKEN }}
        run: scripts/fetch-protocol-fixtures.sh
      - name: Tests (unit, feature, architecture, protocol conformance)
        run: vendor/bin/pest --parallel

  arch-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - name: Prove each architecture rule fails on a deliberate violation
        run: bash scripts/ci/arch-canary.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Wayfinder generates the typed route helpers by running Artisan.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - run: php artisan wayfinder:generate
      - run: php artisan bitflag:types --check
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run stylelint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: The build holds no secrets and no development pages
        run: node scripts/ci/scan-bundle-secrets.mjs
      - name: No committed file matches .gitignore
        run: bash scripts/ci/clean-tree.sh tracked-ignored
      - name: The tests and the build leave no stray files
        run: bash scripts/ci/clean-tree.sh clean

  e2e:
    needs: [backend-test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Sail runs the application, so it needs the Composer dependencies on the host first.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: cp .env.e2e .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - name: Run the containers as the runner user
        run: |
          echo "WWWUSER=$(id -u)" >> "$GITHUB_ENV"
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"
      - run: ./vendor/bin/sail up -d --wait
      - run: ./vendor/bin/sail artisan migrate:fresh --seed --seeder=DemoSeeder --force
      - run: ./vendor/bin/sail npm ci
      - run: ./vendor/bin/sail npm run build
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      # Cypress 16 does not download its browser binary during npm ci, so install and cache it explicitly.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx cypress install
      - uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          wait-on: http://localhost/up
          wait-on-timeout: 120
      - name: Show the application log when a spec fails
        if: failure()
        run: ./vendor/bin/sail artisan about --only=environment; tail -n 100 storage/logs/laravel.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-failures
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
