name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  PHP_EXTENSIONS: bcmath, intl, mbstring, pcntl, pdo_mysql, posix, redis, zip

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php scripts/ci/no-path-repositories.php

  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - run: php artisan migrate --force
      - name: Tests (unit, feature, architecture)
        run: vendor/bin/pest --parallel

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Wayfinder generates the typed route helpers by running Artisan.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - run: php artisan wayfinder:generate
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run stylelint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: No committed file matches .gitignore
        run: bash scripts/ci/clean-tree.sh tracked-ignored
      - name: The tests and the build leave no stray files
        run: bash scripts/ci/clean-tree.sh clean
